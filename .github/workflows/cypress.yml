name: Cypress Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Here is where we manually assign the files to each machine
        shard: 
          - "cypress/e2e/OrangeHRM_Admin.cy.js,cypress/e2e/OrangeHRM_Buzz.cy.js,cypress/e2e/OrangeHRM_Claim.cy.js,cypress/e2e/OrangeHRM_Directory.cy.js"
          - "cypress/e2e/OrangeHRM_Leave.cy.js,cypress/e2e/OrangeHRM_Login.cy.js,cypress/e2e/OrangeHRM_Maintenance.cy.js,cypress/e2e/OrangeHRM_MyInfo.cy.js"
          - "cypress/e2e/OrangeHRM_Performance.cy.js,cypress/e2e/OrangeHRM_PIM.cy.js,cypress/e2e/OrangeHRM_Time.cy.js,cypress/e2e/OrangeHRM_dashboard.cy.js"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          # This passes the specific list of files for THIS machine
          spec: ${{ matrix.shard }}
        continue-on-error: true

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ strategy.job-index }}
          path: cypress/screenshots
          retention-days: 7
